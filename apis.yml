name: Living Carbon
description: 'Living Carbon is a reforestation and carbon removal company that restores abandoned
  mineland and degraded agricultural land in the United States, generating income for landowners while
  producing high-quality carbon removal credits with true additionality, limited leakage, and unique
  co-benefits. It develops fast-growing poplar trees for permanent land restoration and for custom
  biomass feedstock sited near processing facilities. Backed by Homebrew and surfaced through the API
  Evangelist network as a climate-sector company profile; the company publishes no public developer,
  API, or technical surface at this time.'
